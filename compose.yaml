services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules # Prevent local node_modules from overwriting container's
    environment:
      - CHOKIDAR_USEPOLLING=true # Essential for hot-reload on some systems (Windows/WSL)